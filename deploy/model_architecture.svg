<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 820" width="1400" height="820" font-family="'NanumSquare', 'NanumSquareRound', 'NanumBarunGothic', 'NanumGothic', 'Pretendard', 'Noto Sans KR', 'Malgun Gothic', Arial, sans-serif">
  <defs>
    <filter id="cardShadow" x="-3%" y="-3%" width="106%" height="108%">
      <feDropShadow dx="0" dy="6" stdDeviation="12" flood-color="#0F172A" flood-opacity="0.08"/>
    </filter>
    <filter id="boxShadow" x="-6%" y="-6%" width="112%" height="116%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#0F172A" flood-opacity="0.10"/>
    </filter>

    <marker id="arrowDark" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8.5 5 L 0 8.5 z" fill="#1E293B"/>
    </marker>
    <marker id="arrowBlue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8.5 5 L 0 8.5 z" fill="#2563EB"/>
    </marker>
    <marker id="arrowTeal" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8.5 5 L 0 8.5 z" fill="#0F766E"/>
    </marker>
  </defs>

  <!-- Outer Calm Cool-Gray Background -->
  <rect width="1400" height="820" fill="#E2E8F0"/>

  <!-- Inner White Canvas Card -->
  <rect x="28" y="24" width="1344" height="772" rx="20" fill="#FFFFFF" filter="url(#cardShadow)"/>

  <!-- Title Header -->
  <text x="700" y="66" text-anchor="middle" fill="#0F172A" font-size="24" font-weight="800">
    Multimodal Neural Network Architecture (Dual AutoEncoder &amp; 2-Branch Latent Fusion)
  </text>
  <line x1="64" y1="84" x2="1336" y2="84" stroke="#CBD5E1" stroke-width="1.5"/>

  <!-- Stage Headers -->
  <g transform="translate(0, 98)" font-size="16" font-weight="800" fill="#1E293B">
    <rect x="56" y="0" width="190" height="34" rx="7" fill="#F1F5F9" stroke="#CBD5E1"/>
    <text x="151" y="23" text-anchor="middle">1. Input &amp; Scaling</text>

    <rect x="272" y="0" width="416" height="34" rx="7" fill="#F1F5F9" stroke="#CBD5E1"/>
    <text x="480" y="23" text-anchor="middle">2. Dual Residual Encoder &amp; L₂ Norm</text>

    <rect x="714" y="0" width="216" height="34" rx="7" fill="#F1F5F9" stroke="#CBD5E1"/>
    <text x="822" y="23" text-anchor="middle">3. Cross-Attention</text>

    <rect x="956" y="0" width="192" height="34" rx="7" fill="#F1F5F9" stroke="#CBD5E1"/>
    <text x="1052" y="23" text-anchor="middle">4. 2-Branch Fusion</text>

    <rect x="1174" y="0" width="170" height="34" rx="7" fill="#F1F5F9" stroke="#CBD5E1"/>
    <text x="1259" y="23" text-anchor="middle">5. Classifier Head</text>
  </g>

  <!-- ==================== STAGE 1: INPUT & SCALING ==================== -->
  <!-- CAN Input (41D) -->
  <g transform="translate(56, 174)" filter="url(#boxShadow)">
    <rect width="190" height="76" rx="10" fill="#1E3A8A"/>
    <text x="95" y="33" text-anchor="middle" fill="#FFFFFF" font-size="18" font-weight="800">CAN Features</text>
    <text x="95" y="58" text-anchor="middle" fill="#BFDBFE" font-size="16" font-weight="700">41D Vector (x_can)</text>
  </g>

  <line x1="151" y1="250" x2="151" y2="278" stroke="#1E293B" stroke-width="2.2" marker-end="url(#arrowDark)"/>

  <!-- CAN RobustScaler -->
  <g transform="translate(56, 284)" filter="url(#boxShadow)">
    <rect width="190" height="58" rx="10" fill="#F8FAFC" stroke="#1E3A8A" stroke-width="2"/>
    <text x="95" y="26" text-anchor="middle" fill="#0F172A" font-size="16" font-weight="800">RobustScaler</text>
    <text x="95" y="46" text-anchor="middle" fill="#475569" font-size="14" font-weight="700">41D Normalization</text>
  </g>

  <!-- Audio Input (24D) -->
  <g transform="translate(56, 424)" filter="url(#boxShadow)">
    <rect width="190" height="76" rx="10" fill="#334155"/>
    <text x="95" y="33" text-anchor="middle" fill="#FFFFFF" font-size="18" font-weight="800">Audio Features</text>
    <text x="95" y="58" text-anchor="middle" fill="#CBD5E1" font-size="16" font-weight="700">24D Vector (x_aud)</text>
  </g>

  <line x1="151" y1="500" x2="151" y2="528" stroke="#1E293B" stroke-width="2.2" marker-end="url(#arrowDark)"/>

  <!-- Audio RobustScaler -->
  <g transform="translate(56, 534)" filter="url(#boxShadow)">
    <rect width="190" height="58" rx="10" fill="#F8FAFC" stroke="#334155" stroke-width="2"/>
    <text x="95" y="26" text-anchor="middle" fill="#0F172A" font-size="16" font-weight="800">RobustScaler</text>
    <text x="95" y="46" text-anchor="middle" fill="#475569" font-size="14" font-weight="700">24D Normalization</text>
  </g>


  <!-- ==================== STAGE 2 & 3: DUAL AUTOENCODER CONTAINER ==================== -->
  <rect x="272" y="148" width="658" height="468" rx="14" fill="#F8FAFC" stroke="#2563EB" stroke-width="2" stroke-dasharray="6,4"/>
  <rect x="288" y="136" width="236" height="26" rx="6" fill="#2563EB"/>
  <text x="406" y="154" text-anchor="middle" fill="#FFFFFF" font-size="14.5" font-weight="800">DualAutoEncoder (PyTorch)</text>

  <!-- Arrows from Scalers to Encoders -->
  <path d="M 246 313 L 266 313 L 266 234 L 286 234" fill="none" stroke="#1E293B" stroke-width="2.2" marker-end="url(#arrowDark)"/>
  <path d="M 246 563 L 266 563 L 266 494 L 286 494" fill="none" stroke="#1E293B" stroke-width="2.2" marker-end="url(#arrowDark)"/>

  <!-- Top Branch: CAN Encoder (can_enc) -->
  <rect x="288" y="172" width="388" height="124" rx="10" fill="#FFFFFF" stroke="#93C5FD" stroke-width="1.8"/>
  <text x="482" y="194" text-anchor="middle" fill="#1E3A8A" font-size="15.5" font-weight="800">CAN Encoder (can_enc)</text>

  <!-- CAN ResBlock 1 -->
  <g transform="translate(302, 206)" filter="url(#boxShadow)">
    <rect width="110" height="72" rx="8" fill="#1E3A8A"/>
    <text x="55" y="29" text-anchor="middle" fill="#FFFFFF" font-size="15.5" font-weight="800">ResBlock 1</text>
    <text x="55" y="52" text-anchor="middle" fill="#BFDBFE" font-size="14.5" font-weight="700">41D → 32D</text>
  </g>

  <line x1="412" y1="242" x2="428" y2="242" stroke="#1E293B" stroke-width="2" marker-end="url(#arrowDark)"/>

  <!-- CAN ResBlock 2 -->
  <g transform="translate(432, 206)" filter="url(#boxShadow)">
    <rect width="110" height="72" rx="8" fill="#1E3A8A"/>
    <text x="55" y="29" text-anchor="middle" fill="#FFFFFF" font-size="15.5" font-weight="800">ResBlock 2</text>
    <text x="55" y="52" text-anchor="middle" fill="#BFDBFE" font-size="14.5" font-weight="700">32D → 16D</text>
  </g>

  <line x1="542" y1="242" x2="558" y2="242" stroke="#1E293B" stroke-width="2" marker-end="url(#arrowDark)"/>

  <!-- CAN L2 Norm -->
  <g transform="translate(562, 206)" filter="url(#boxShadow)">
    <rect width="100" height="72" rx="8" fill="#EFF6FF" stroke="#2563EB" stroke-width="2"/>
    <text x="50" y="29" text-anchor="middle" fill="#1E3A8A" font-size="15.5" font-weight="800">L₂ Norm</text>
    <text x="50" y="52" text-anchor="middle" fill="#2563EB" font-size="14.5" font-weight="800">z_c (16D)</text>
  </g>


  <!-- Bottom Branch: Audio Encoder (audio_enc) -->
  <rect x="288" y="432" width="388" height="124" rx="10" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.8"/>
  <text x="482" y="454" text-anchor="middle" fill="#334155" font-size="15.5" font-weight="800">Audio Encoder (audio_enc)</text>

  <!-- Audio ResBlock 1 -->
  <g transform="translate(302, 466)" filter="url(#boxShadow)">
    <rect width="110" height="72" rx="8" fill="#334155"/>
    <text x="55" y="29" text-anchor="middle" fill="#FFFFFF" font-size="15.5" font-weight="800">ResBlock 1</text>
    <text x="55" y="52" text-anchor="middle" fill="#CBD5E1" font-size="14.5" font-weight="700">24D → 32D</text>
  </g>

  <line x1="412" y1="502" x2="428" y2="502" stroke="#1E293B" stroke-width="2" marker-end="url(#arrowDark)"/>

  <!-- Audio ResBlock 2 -->
  <g transform="translate(432, 466)" filter="url(#boxShadow)">
    <rect width="110" height="72" rx="8" fill="#334155"/>
    <text x="55" y="29" text-anchor="middle" fill="#FFFFFF" font-size="15.5" font-weight="800">ResBlock 2</text>
    <text x="55" y="52" text-anchor="middle" fill="#CBD5E1" font-size="14.5" font-weight="700">32D → 16D</text>
  </g>

  <line x1="542" y1="502" x2="558" y2="502" stroke="#1E293B" stroke-width="2" marker-end="url(#arrowDark)"/>

  <!-- Audio L2 Norm -->
  <g transform="translate(562, 466)" filter="url(#boxShadow)">
    <rect width="100" height="72" rx="8" fill="#F1F5F9" stroke="#334155" stroke-width="2"/>
    <text x="50" y="29" text-anchor="middle" fill="#0F172A" font-size="15.5" font-weight="800">L₂ Norm</text>
    <text x="50" y="52" text-anchor="middle" fill="#334155" font-size="14.5" font-weight="800">z_a (16D)</text>
  </g>

  <!-- ResBlock Detail Inset Box (Middle between CAN and Audio Encoders) -->
  <rect x="288" y="314" width="388" height="100" rx="8" fill="#F1F5F9" stroke="#94A3B8" stroke-width="1.5"/>
  <text x="482" y="336" text-anchor="middle" fill="#0F172A" font-size="14.5" font-weight="800">
    Gated Residual Block 내부 구조 (ResBlock)
  </text>
  <text x="482" y="362" text-anchor="middle" fill="#334155" font-size="14" font-weight="700">
    Main: Linear → LayerNorm → GELU → Linear → LayerNorm
  </text>
  <text x="482" y="386" text-anchor="middle" fill="#1D4ED8" font-size="14" font-weight="700">
    Output: GELU( Main(x) + Shortcut_Linear(x) )
  </text>


  <!-- ==================== STAGE 3: CROSS-MODAL ATTENTION ==================== -->
  <g transform="translate(714, 172)" filter="url(#boxShadow)">
    <rect width="196" height="384" rx="12" fill="#FFFFFF" stroke="#2563EB" stroke-width="2.2"/>
    <rect x="14" y="14" width="168" height="34" rx="7" fill="#2563EB"/>
    <text x="98" y="37" text-anchor="middle" fill="#FFFFFF" font-size="16" font-weight="800">Cross-Attention</text>

    <!-- Q, K, V projections -->
    <rect x="18" y="64" width="160" height="72" rx="8" fill="#EFF6FF" stroke="#93C5FD" stroke-width="1.5"/>
    <text x="98" y="88" text-anchor="middle" fill="#1E3A8A" font-size="15" font-weight="800">CAN ← Audio</text>
    <text x="98" y="110" text-anchor="middle" fill="#334155" font-size="13.5" font-weight="700">Q_aud · K_can / √16</text>
    <text x="98" y="128" text-anchor="middle" fill="#1D4ED8" font-size="13.5" font-weight="800">z_c_att (16D)</text>

    <!-- Bi-directional icon in middle -->
    <line x1="70" y1="152" x2="126" y2="216" stroke="#2563EB" stroke-width="2" stroke-dasharray="4,3"/>
    <line x1="126" y1="152" x2="70" y2="216" stroke="#2563EB" stroke-width="2" stroke-dasharray="4,3"/>
    <rect x="34" y="170" width="128" height="30" rx="6" fill="#1E3A8A"/>
    <text x="98" y="190" text-anchor="middle" fill="#FFFFFF" font-size="13.5" font-weight="800">16D ↔ 16D 정렬</text>

    <rect x="18" y="232" width="160" height="72" rx="8" fill="#F1F5F9" stroke="#94A3B8" stroke-width="1.5"/>
    <text x="98" y="256" text-anchor="middle" fill="#0F172A" font-size="15" font-weight="800">Audio ← CAN</text>
    <text x="98" y="278" text-anchor="middle" fill="#334155" font-size="13.5" font-weight="700">Q_can · K_aud / √16</text>
    <text x="98" y="296" text-anchor="middle" fill="#334155" font-size="13.5" font-weight="800">z_a_att (16D)</text>

    <!-- Distance / Similarity computation -->
    <rect x="18" y="318" width="160" height="52" rx="8" fill="#F8FAFC" stroke="#2563EB" stroke-width="1.5"/>
    <text x="98" y="340" text-anchor="middle" fill="#1E3A8A" font-size="14" font-weight="800">구면 유사도 &amp; 거리</text>
    <text x="98" y="360" text-anchor="middle" fill="#475569" font-size="13" font-weight="700">CosSim (1D), Dist (1D)</text>
  </g>

  <!-- Arrows from L2 Norm to Cross-Attention -->
  <line x1="662" y1="242" x2="710" y2="242" stroke="#2563EB" stroke-width="2.2" marker-end="url(#arrowBlue)"/>
  <line x1="662" y1="502" x2="710" y2="502" stroke="#1E293B" stroke-width="2.2" marker-end="url(#arrowDark)"/>


  <!-- ==================== STAGE 4: 40D 2-BRANCH FUSION VECTOR ==================== -->
  <g transform="translate(956, 148)" filter="url(#boxShadow)">
    <rect width="192" height="536" rx="12" fill="#F8FAFC" stroke="#0F766E" stroke-width="2.2"/>
    <rect x="14" y="14" width="164" height="36" rx="7" fill="#0F766E"/>
    <text x="96" y="38" text-anchor="middle" fill="#FFFFFF" font-size="16" font-weight="800">Concatenate (40D)</text>

    <!-- Block 1: z_c_att (16D) -->
    <rect x="18" y="68" width="156" height="82" rx="8" fill="#1E3A8A"/>
    <text x="96" y="103" text-anchor="middle" fill="#FFFFFF" font-size="17" font-weight="800">z_c_att</text>
    <text x="96" y="129" text-anchor="middle" fill="#BFDBFE" font-size="15" font-weight="700">CAN Latent (16D)</text>

    <!-- Block 2: z_a_att (16D) -->
    <rect x="18" y="164" width="156" height="82" rx="8" fill="#334155"/>
    <text x="96" y="199" text-anchor="middle" fill="#FFFFFF" font-size="17" font-weight="800">z_a_att</text>
    <text x="96" y="225" text-anchor="middle" fill="#CBD5E1" font-size="15" font-weight="700">Audio Latent (16D)</text>

    <!-- Block 3: CosSim (1D) -->
    <rect x="18" y="260" width="156" height="66" rx="8" fill="#2563EB"/>
    <text x="96" y="289" text-anchor="middle" fill="#FFFFFF" font-size="16" font-weight="800">CosSim (1D)</text>
    <text x="96" y="312" text-anchor="middle" fill="#DBEAFE" font-size="13.5" font-weight="700">코사인 유사도</text>

    <!-- Block 4: Latent Dist (1D) -->
    <rect x="18" y="340" width="156" height="66" rx="8" fill="#2563EB"/>
    <text x="96" y="369" text-anchor="middle" fill="#FFFFFF" font-size="16" font-weight="800">Latent Dist (1D)</text>
    <text x="96" y="392" text-anchor="middle" fill="#DBEAFE" font-size="13.5" font-weight="700">구면 거리 √(2(1−cos))</text>

    <!-- Block 5: Physics Energy (6D) -->
    <rect x="18" y="420" width="156" height="96" rx="8" fill="#0F766E"/>
    <text x="96" y="452" text-anchor="middle" fill="#FFFFFF" font-size="16.5" font-weight="800">Physics Energy</text>
    <text x="96" y="476" text-anchor="middle" fill="#CCFBF1" font-size="15" font-weight="800">e_physics (6D)</text>
    <text x="96" y="499" text-anchor="middle" fill="#99F6E4" font-size="13" font-weight="700">원시 파형·충격 지수</text>
  </g>

  <!-- Arrows from Cross-Attention into 40D Fusion Stack -->
  <line x1="910" y1="257" x2="952" y2="257" stroke="#2563EB" stroke-width="2.2" marker-end="url(#arrowBlue)"/>
  <line x1="910" y1="436" x2="952" y2="436" stroke="#1E293B" stroke-width="2.2" marker-end="url(#arrowDark)"/>
  <line x1="910" y1="514" x2="952" y2="514" stroke="#2563EB" stroke-width="2.2" marker-end="url(#arrowBlue)"/>

  <!-- Branch 2 Bypass Arrow: Audio Features (24D) -> Physics Energy (6D) -->
  <path d="M 246 462 L 260 462 L 260 656 L 936 656 L 936 616 L 952 616" fill="none" stroke="#0F766E" stroke-width="2.6" stroke-dasharray="7,5" marker-end="url(#arrowTeal)"/>
  <rect x="420" y="638" width="380" height="34" rx="7" fill="#F0FDFA" stroke="#0F766E" stroke-width="1.8"/>
  <text x="610" y="661" text-anchor="middle" fill="#0F766E" font-size="15.5" font-weight="800">
    Branch 2 물리 에너지 바이패스 (x_aud 상위 6D 직접 결합)
  </text>


  <!-- ==================== STAGE 5: CLASSIFIER HEAD & OUTPUT ==================== -->
  <!-- Fast Linear Head -->
  <g transform="translate(1174, 240)" filter="url(#boxShadow)">
    <rect width="170" height="156" rx="12" fill="#FFFFFF" stroke="#1E3A8A" stroke-width="2.2"/>
    <rect x="12" y="14" width="146" height="34" rx="7" fill="#1E3A8A"/>
    <text x="85" y="37" text-anchor="middle" fill="#FFFFFF" font-size="16" font-weight="800">Fast Linear Head</text>

    <text x="85" y="76" text-anchor="middle" fill="#0F172A" font-size="16" font-weight="800">40D → 1D Logit</text>
    <text x="85" y="102" text-anchor="middle" fill="#334155" font-size="15" font-weight="700">z = wᵀ · x_40d + b</text>
    <text x="85" y="132" text-anchor="middle" fill="#2563EB" font-size="15.5" font-weight="800">Sigmoid σ(z)</text>
  </g>

  <line x1="1148" y1="318" x2="1170" y2="318" stroke="#1E293B" stroke-width="2.4" marker-end="url(#arrowDark)"/>
  <line x1="1259" y1="396" x2="1259" y2="444" stroke="#1E293B" stroke-width="2.4" marker-end="url(#arrowDark)"/>

  <!-- Final Decision Output -->
  <g transform="translate(1174, 450)" filter="url(#boxShadow)">
    <rect width="170" height="134" rx="12" fill="#0F766E"/>
    <text x="85" y="36" text-anchor="middle" fill="#FFFFFF" font-size="18" font-weight="800">최종 상태 판정</text>
    <line x1="20" y1="48" x2="150" y2="48" stroke="#5EEAD4" stroke-width="1.5"/>
    <text x="85" y="78" text-anchor="middle" fill="#FFFFFF" font-size="16.5" font-weight="800">P ≥ 0.5 → 1 (이상)</text>
    <text x="85" y="108" text-anchor="middle" fill="#CCFBF1" font-size="16.5" font-weight="800">P &lt; 0.5 → 0 (정상)</text>
  </g>


  <!-- ==================== BOTTOM SUMMARY BAR ==================== -->
  <rect x="56" y="718" width="1288" height="50" rx="10" fill="#F1F5F9" stroke="#CBD5E1" stroke-width="1.5"/>
  <text x="700" y="749" text-anchor="middle" fill="#0F172A" font-size="16.5" font-weight="800">
    입력: CAN (41D) + Audio (24D)   |   잠재 임베딩: S¹⁵ 단위 구면 (16D + 16D)   |   융합 벡터: 40D (Pattern 34D + Energy 6D)   |   추론 지연: 3.94 ms
  </text>
</svg>

